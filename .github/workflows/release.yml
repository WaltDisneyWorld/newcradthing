name: build-windows-exe

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release exe
        run: cargo build --release
      - name: Stage package (exe + artwork)
        shell: bash
        run: |
          mkdir -p ProCard-win64/assets
          cp target/release/procard.exe ProCard-win64/procard.exe
          cp -r assets/artwork ProCard-win64/assets/artwork
          cp README.md ProCard-win64/README.md
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ProCard-win64
          path: ProCard-win64
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/procard.exe
